# =============================================================================
# PandaProbe — Local Docker Compose
#
# Builds the backend and frontend from the checked-out source tree.
#
#   1. cp backend/.env.example backend/.env.development
#   2. cp frontend/.env.example frontend/.env.development
#   3. docker compose up --build
# =============================================================================

services:
  # ---------- FastAPI application ----------
  app:
    container_name: pandaprobe-app
    build:
      context: ./backend
      args:
        APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ~/.config/gcloud:/home/appuser/.config/gcloud:ro
    env_file:
      - ./backend/.env.development
    environment:
      - APP_ENV=development
      - GOOGLE_APPLICATION_CREDENTIALS=/home/appuser/.config/gcloud/application_default_credentials.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pandaprobe

  # ---------- PostgreSQL ----------
  postgres:
    container_name: pandaprobe-postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pandaprobe_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - pandaprobe

  # ---------- Next.js frontend ----------
  frontend:
    container_name: pandaprobe-frontend
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    env_file:
      - path: ./frontend/.env.development
        required: false
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    depends_on:
      app:
        condition: service_healthy
    networks:
      - pandaprobe

networks:
  pandaprobe:
    driver: bridge

volumes:
  postgres-data:
